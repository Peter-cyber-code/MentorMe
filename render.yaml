# Déploiement Render : base PostgreSQL + Redis + API Django (Daphne).
# Render > New > Blueprint > choisir ce dépôt.
databases:
  - name: mentorme-db
    plan: free
    databaseName: mentorme
    user: mentorme

services:
  - type: keyvalue
    name: mentorme-redis
    plan: free
    ipAllowList: []          # accès interne uniquement
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: mentorme-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py bootstrap && daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "0"           # Render redirige déjà http -> https
      - key: DJANGO_HSTS_SECONDS
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: mentorme-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mentorme-redis
          property: connectionString
      - key: SERVE_MEDIA
        value: "1"
      - key: SEED_DEMO
        value: "1"           # comptes et données de démonstration (mettre 0 ensuite si besoin)
      - key: AUDIT_PROVIDER
        value: mock          # "openai" + OPENAI_API_KEY pour un vrai audit IA
      - key: ADMIN_EMAIL
        sync: false          # demandé à la création (votre e-mail d'administrateur)
      - key: ADMIN_PASSWORD
        sync: false          # demandé à la création (mot de passe fort)
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # adresse du site web Flutter, ex. https://mentorme.netlify.app
